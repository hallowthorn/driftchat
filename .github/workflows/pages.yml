name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Points the site at the chat server. Set it under
      # Settings → Secrets and variables → Actions → Variables → DRIFTCHAT_SERVER
      - name: Write config.js
        env:
          DRIFTCHAT_SERVER: ${{ vars.DRIFTCHAT_SERVER }}
        run: |
          node -e "require('fs').writeFileSync('public/config.js', 'window.DRIFTCHAT_SERVER = ' + JSON.stringify(process.env.DRIFTCHAT_SERVER || '') + ';\n')"
          cat public/config.js

      # Cache-bust: GitHub Pages caches files for 10 minutes, so stamp each deploy's
      # script/style URLs with the run id; visitors always get the matching set.
      - name: Version asset URLs
        run: |
          v=${{ github.run_id }}
          sed -i -E "s#(src|href)=\"(config\.js|app\.js|style\.css)\"#\1=\"\2?v=$v\"#g" public/index.html public/admin.html
          grep -n "?v=" public/index.html public/admin.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
